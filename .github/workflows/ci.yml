name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

jobs:
  # Known vulnerabilities in dependencies and secrets anywhere in the history.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, for the secret scan
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Fails on high or critical vulnerabilities (production or development).
      - run: npm audit --audit-level=high
      - name: Secret scan (gitleaks, full history)
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --redact --no-banner

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Unit and source tests with minimum coverage thresholds.
      - run: npm run test:coverage
      # The build only needs the public settings to exist; it does not contact Supabase.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  # The migrations on an empty database, demo:setup, the authorization, business-rule and
  # concurrency tests against the local Supabase, and the browser tests on a production build.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Studio and its metadata service are left out to start faster; the invitation browser test
      # needs Mailpit and the Edge runtime. The image registry sometimes
      # refuses downloads for a while ("toomanyrequests"), so the start is retried before failing.
      - name: Start the local Supabase
        run: |
          for attempt in 1 2 3; do
            npx supabase start -x studio,postgres-meta && exit 0
            echo "Attempt $attempt to start Supabase failed; retrying in 30 seconds."
            npx supabase stop --no-backup || true
            sleep 30
          done
          exit 1
      - run: npm run demo:setup
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
